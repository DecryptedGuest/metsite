# railway.toml
# Railway retired the NIXPACKS builder — the only supported builders are now
# RAILPACK and DOCKERFILE, so a build pinned to NIXPACKS fails instantly at the
# build-image stage with no output. RAILPACK is the drop-in successor
# (auto-detects Node); it honours buildCommand + the deploy startCommand below.
[build]
builder = "RAILPACK"
buildCommand = "npm install && npx prisma generate"

[deploy]
startCommand = "npx prisma db push --accept-data-loss && node server/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# railway.toml
# Railway retired the NIXPACKS builder — the only supported builders are now
# RAILPACK and DOCKERFILE, so a build pinned to NIXPACKS fails instantly at the
# build-image stage with no output. RAILPACK is the drop-in successor
# (auto-detects Node); it honours buildCommand + the deploy startCommand below.
[build]
builder = "RAILPACK"
buildCommand = "npm install && npx prisma generate"

[deploy]
# NOT "prisma db push && node server/index.js". That `&&` meant an unreachable
# database stopped the server from starting at all, so a database outage became a
# total outage — no site, no health check, and no way to reach the env-var kill
# switches for the background workers, which is precisely when you want them.
# scripts/start.js attempts the sync, bounds how long it will wait, and starts the
# server either way.
startCommand = "node scripts/start.js"
restartPolicyType = "ON_FAILURE"
# Was 3, which a database outage exhausted in under a minute and then stayed down
# even after the database came back.
restartPolicyMaxRetries = 10

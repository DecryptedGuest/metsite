<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MET · IA Applications</title>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("iacms_theme")||"dark");</script>
<script src="/js/emoji-map.js?v=1"></script>
  <script src="/js/emoji.js?v=1"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
<link rel="stylesheet" href="/css/system.css?v=1" />
  <style>
    body { overflow-y: auto; overflow-x: hidden; }
    .iar-wrap { max-width: 1080px; margin: 0 auto; padding: 1.4rem 1.2rem 6rem; position: relative; z-index: 1; }

    .iar-head { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .iar-title { font-family: var(--font-display); font-size: 21px; font-weight: 700;
                 letter-spacing: .04em; text-transform: uppercase; color: var(--text-primary); }
    .iar-sub { font-size: 12px; color: var(--text-muted); letter-spacing: .06em; }
    .iar-head .spacer { flex: 1; }

    .iar-tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
    .iar-tab { font-size: 12.5px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
               border: 1px solid var(--border-dim); background: transparent; color: var(--text-secondary); }
    .iar-tab.on { border-color: var(--violet, #9d7dff); background: rgba(157,125,255,.12); color: var(--text-primary); }
    .iar-tab .n { font-family: var(--font-mono); font-size: 11px; opacity: .75; margin-left: 5px; }

    /* ── The queue ─────────────────────────────────────────────────── */
    .iar-row { display: flex; gap: 1rem; align-items: center; padding: .85rem 1rem;
               border-bottom: 1px solid var(--border-dim); cursor: pointer; flex-wrap: wrap; }
    .iar-row:hover { background: var(--bg-input); }
    .iar-row:last-child { border-bottom: none; }
    .iar-ref { font-family: var(--font-mono); font-size: 12px; color: rgba(157,125,255,.85); min-width: 66px; }
    .iar-who { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 2px; }
    .iar-who .a { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .iar-who .b { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .iar-when { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); }

    /* First pick belongs to the divisionless, so the queue has to show it. */
    .iar-pick { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px;
                border-radius: 4px; font-weight: 600; }
    .iar-pick.first { background: rgba(46,216,150,.14); color: var(--green); border: 1px solid rgba(46,216,150,.32); }
    .iar-pick.later { background: var(--bg-input); color: var(--text-muted); border: 1px solid var(--border-dim); }

    .iar-chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .iar-chip { font-size: 10.5px; padding: 2px 7px; border-radius: 4px; font-weight: 600; letter-spacing: .04em; }
    .iar-chip.ev  { background: rgba(240,79,94,.14); color: #ff9aa4; border: 1px solid rgba(240,79,94,.34); }
    .iar-chip.sug { background: rgba(245,183,48,.12); color: #ffd98a; border: 1px solid rgba(245,183,48,.3); }

    /* ── One application ───────────────────────────────────────────── */
    .iar-back { margin-bottom: .9rem; }
    .iar-idbar { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
                 padding: .9rem 1.1rem; margin-bottom: 1rem; }
    .iar-idbar .k { font-size: 10.5px; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; }
    .iar-idbar .v { font-size: 13px; color: var(--text-primary); font-weight: 500; }
    .iar-idbar .cell { display: flex; flex-direction: column; gap: 2px; }

    .iar-panel { padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
    .iar-phead { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .06em;
                 text-transform: uppercase; color: var(--text-muted); margin-bottom: .8rem;
                 display: flex; align-items: center; gap: .5rem; }

    /* ── Integrity findings ────────────────────────────────────────── */
    .iar-find { border-radius: var(--radius-md); padding: .75rem .9rem; margin-bottom: .6rem;
                border: 1px solid var(--border-dim); background: var(--bg-input); }
    .iar-find.evidence   { border-color: rgba(240,79,94,.35);  background: rgba(240,79,94,.07); }
    .iar-find.suggestive { border-color: rgba(245,183,48,.32); background: rgba(245,183,48,.06); }
    .iar-find .lbl { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.5; }
    .iar-find .sev { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; font-weight: 700;
                     margin-right: .5rem; }
    .iar-find.evidence   .sev { color: var(--red); }
    .iar-find.suggestive .sev { color: var(--amber); }
    .iar-find.note       .sev { color: var(--text-muted); }
    .iar-find .det { font-size: 12.5px; color: var(--text-secondary); line-height: 1.7; margin-top: .3rem; }
    .iar-find .items { margin: .45rem 0 0; padding-left: 17px; }
    .iar-find .items li { font-size: 11.5px; color: var(--text-muted); line-height: 1.7; font-family: var(--font-mono); }

    .iar-nofind { font-size: 12.5px; color: var(--text-secondary); line-height: 1.7; }

    /* ── Answers and marking ───────────────────────────────────────── */
    .iar-sect { margin-bottom: 1.4rem; }
    .iar-sname { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--violet, #9d7dff);
                 font-weight: 700; margin-bottom: .6rem; }
    .iar-a { padding: .9rem 0; border-top: 1px solid var(--border-dim); }
    .iar-a:first-of-type { border-top: none; padding-top: 0; }
    .iar-q { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.55; margin-bottom: .35rem; }
    .iar-ans { font-size: 13px; color: var(--text-secondary); line-height: 1.75; white-space: pre-wrap;
               background: var(--bg-input); border: 1px solid var(--border-dim); border-radius: 8px;
               padding: .7rem .85rem; }
    .iar-ans.empty { color: var(--text-muted); font-style: italic; }
    .iar-meta { display: flex; gap: .9rem; align-items: center; flex-wrap: wrap;
                font-size: 11px; color: var(--text-muted); margin-top: .35rem; font-family: var(--font-mono); }
    .iar-meta .warn { color: var(--amber); }
    .iar-meta .bad  { color: var(--red); }

    .iar-mark { display: flex; gap: .6rem; align-items: center; margin-top: .5rem; flex-wrap: wrap; }
    .iar-mark label { font-size: 11.5px; color: var(--text-muted); letter-spacing: .04em; }
    .iar-mark input { width: 64px; text-align: center; font-family: var(--font-mono); }
    .iar-mark .of { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); }
    .iar-mark .quick { display: flex; gap: 4px; }
    .iar-mark .quick button { font-size: 11px; padding: 3px 9px; border-radius: 5px;
                              border: 1px solid var(--border-dim); background: transparent;
                              color: var(--text-secondary); cursor: pointer; }
    .iar-mark .quick button:hover { border-color: var(--violet, #9d7dff); color: var(--text-primary); }
    .iar-guide { font-size: 11.5px; color: var(--text-muted); line-height: 1.65; margin-top: .3rem;
                 border-left: 2px solid rgba(157,125,255,.4); padding-left: .6rem; }

    /* A multiple-choice answer with no key: the marker is told WHY it is not
       pre-marked, rather than seeing a blank box and guessing. */
    .iar-nokey { font-size: 11.5px; color: var(--amber); line-height: 1.6; margin-top: .3rem; }

    .iar-total { position: sticky; bottom: 0; z-index: 5; margin-top: 1rem;
                 padding: .9rem 1.1rem; border-radius: var(--radius-md);
                 background: var(--bg-panel); border: 1px solid var(--border-bright);
                 box-shadow: 0 -6px 26px rgba(0,0,0,.42);
                 display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .iar-total .n { font-family: var(--font-mono); font-size: 19px; font-weight: 700; color: var(--text-primary); }
    .iar-total .pc { font-size: 12px; color: var(--text-muted); }
    .iar-total .spacer { flex: 1; }
    .iar-total.pass .n { color: var(--green); }
    .iar-total.fail .n { color: var(--amber); }

    .iar-state { text-align: center; padding: 3rem 1.5rem; }
    .iar-state .big { font-size: 40px; margin-bottom: .8rem; }
    .iar-state h2 { font-family: var(--font-display); font-size: 17px; letter-spacing: .04em;
                    text-transform: uppercase; margin: 0 0 .5rem; color: var(--text-primary); }
    .iar-state p { font-size: 13px; color: var(--text-secondary); line-height: 1.75; max-width: 48ch; margin: 0 auto; }


    /* The open/closed control. Deliberately at the top and deliberately loud
       when it is closed — a shut intake that nobody remembers shutting is how a
       recruitment round quietly loses a fortnight. */
    .iar-gate { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
                border: 1px solid var(--border-dim); border-radius: var(--radius-md);
                padding: .8rem 1rem; margin-bottom: 1.1rem; background: rgba(46,216,150,.05); }
    .iar-gate.closed { background: rgba(245,183,48,.07); border-color: rgba(245,183,48,.32); }
    .iar-gate-main { min-width: 210px; }
    .iar-gate-state { font-family: var(--font-display); font-size: 13px; letter-spacing: .06em;
                      text-transform: uppercase; color: var(--green); }
    .iar-gate.closed .iar-gate-state { color: var(--amber); }
    .iar-gate-sub { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; margin-top: 2px; }
    .iar-gate-note { flex: 1 1 260px; font-size: 12.5px; }
    .iar-gate.open .iar-gate-note { display: none; }
    @media (max-width: 620px) { .iar-gate { gap: .6rem; } }

    /* ── The applicant's profile ───────────────────────────────────────
       The one part of this page that is about a PERSON rather than about a
       paper, so it leans on pictures and on space, and every number that
       carries a rule sits next to whether the rule is met. */
    .iar-prof-loading .spinner { display: inline-block; vertical-align: -2px; margin-right: .4rem; }

    .iar-idents { display: grid; grid-template-columns: 1.15fr 1fr; gap: 1rem; }
    .iar-ident { display: flex; gap: .9rem; padding: .9rem; border-radius: var(--radius-md);
                 border: 1px solid var(--border-dim); background: rgba(255,255,255,.015); }
    .iar-ident.rbx { border-left: 3px solid var(--green); }
    .iar-ident.dsc { border-left: 3px solid #5865f2; }
    .iar-ident-pics { position: relative; flex: 0 0 auto; width: 104px; height: 104px; }
    .iar-av { display: block; border-radius: var(--radius-md); background: rgba(255,255,255,.04);
              object-fit: cover; border: 1px solid var(--border-dim); }
    .iar-av.big { width: 104px; height: 104px; }
    .iar-av.small { width: 40px; height: 40px; border-radius: 50%; position: absolute;
                    right: -8px; bottom: -8px; border: 2px solid var(--bg-panel, #0b1220); }
    .iar-av.none { display: flex; align-items: center; justify-content: center;
                   color: var(--text-muted); font-size: 26px; }
    .iar-av.small.none { font-size: 15px; }
    .iar-ident-body { min-width: 0; flex: 1 1 auto; }
    .iar-ident-top { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
                     color: var(--text-muted); display: flex; align-items: center; gap: .35rem; }
    .iar-ident-name { font-family: var(--font-mono); font-size: 16px; color: var(--text-primary);
                      font-weight: 600; margin: 2px 0 0; word-break: break-all; }
    .iar-ident-sub { font-size: 11.5px; color: var(--text-muted); margin-bottom: .5rem; }
    .iar-ident-rows { display: flex; flex-direction: column; gap: 1px; margin-top: .45rem; }
    .iar-ident-link { display: inline-flex; align-items: center; gap: .3rem; margin-top: .6rem;
                      font-size: 11.5px; color: var(--blue); text-decoration: none; }
    .iar-ident-link:hover { text-decoration: underline; }

    .iar-kv { display: flex; gap: .6rem; align-items: baseline; font-size: 12px; padding: 2px 0; }
    .iar-kv .k { color: var(--text-muted); min-width: 118px; flex: 0 0 auto; }
    .iar-kv .v { color: var(--text-primary); min-width: 0; word-break: break-word; }
    .iar-kv .v.ok  { color: var(--green); }
    .iar-kv .v.bad { color: var(--amber); }
    .iar-dim { color: var(--text-muted); font-weight: 400; }

    /* A rule and its verdict, inline, because "142 days" means nothing on its own. */
    .iar-rule { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; margin-left: .3rem;
                border: 1px solid transparent; white-space: nowrap; }
    .iar-rule.ok  { color: var(--green); background: var(--green-dim); border-color: rgba(46,216,150,.3); }
    .iar-rule.bad { color: var(--red);   background: var(--red-dim);   border-color: rgba(240,79,94,.32); }
    .iar-rule.unk { color: var(--text-muted); background: rgba(255,255,255,.04); border-color: var(--border-dim); }

    /* The checks, as a row somebody scans before reading a word of prose. */
    .iar-checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
                  gap: .5rem; margin-top: 1rem; }
    .iar-check { display: grid; grid-template-columns: 18px 1fr; gap: .1rem .5rem;
                 padding: .55rem .7rem; border-radius: var(--radius-md);
                 border: 1px solid var(--border-dim); background: rgba(255,255,255,.015); }
    .iar-check i { grid-row: span 2; align-self: center; font-size: 16px; }
    .iar-check .l { font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .iar-check .d { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
    .iar-check.ok   { border-color: rgba(46,216,150,.28); background: var(--green-dim); }
    .iar-check.ok i { color: var(--green); }
    .iar-check.bad  { border-color: rgba(240,79,94,.32); background: var(--red-dim); }
    .iar-check.bad i { color: var(--red); }
    .iar-check.unk i { color: var(--text-muted); }
    .iar-check.note { border-color: rgba(60,110,255,.28); background: var(--blue-dim); }
    .iar-check.note i { color: var(--blue); }

    .iar-grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .1rem 1.2rem; }

    /* Changed since they applied. */
    .iar-drifts { display: flex; flex-direction: column; gap: .35rem; }
    .iar-drift { display: flex; align-items: center; gap: .5rem; font-size: 12px; flex-wrap: wrap; }
    .iar-drift .w { color: var(--text-muted); min-width: 118px; }
    .iar-drift .t { color: var(--text-muted); text-decoration: line-through; }
    .iar-drift .n { color: var(--amber); font-weight: 600; }
    .iar-drift i { color: var(--text-muted); font-size: 13px; }

    .iar-punish { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .7rem; }
    .iar-pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-dim); }
    .iar-pill.bad { color: var(--red); background: var(--red-dim); border-color: rgba(240,79,94,.32); }

    /* Recent cases. Deliberately a list, not a table: it is five rows, and a
       table's headers would take more room than the rows do. */
    .iar-cases { margin-top: .8rem; border-top: 1px solid var(--border-dim);
                 max-height: 260px; overflow-y: auto; }
    .iar-case { display: grid; grid-template-columns: 68px 130px 74px 128px 1fr;
                gap: .6rem; align-items: baseline; padding: .45rem 0;
                border-bottom: 1px solid var(--border-dim); font-size: 11.5px; }
    .iar-case .r { color: var(--blue); }
    .iar-case .a { color: var(--text-primary); font-weight: 500; }
    .iar-case .s { color: var(--text-muted); text-transform: capitalize; }
    .iar-case .w { color: var(--text-muted); }
    .iar-case .y { color: var(--text-secondary); line-height: 1.5; }

    .iar-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: .5rem;
                  max-height: 340px; overflow-y: auto; }
    .iar-group { display: grid; grid-template-columns: 32px 1fr; gap: 0 .55rem; align-items: center;
                 padding: .45rem .55rem; border-radius: var(--radius-md); text-decoration: none;
                 border: 1px solid var(--border-dim); background: rgba(255,255,255,.015); }
    .iar-group:hover { border-color: var(--blue); }
    .iar-group img, .iar-group .ico { width: 32px; height: 32px; border-radius: 6px; grid-row: span 2;
                                      background: rgba(255,255,255,.04); object-fit: cover; }
    .iar-group .ico { display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
    .iar-group .n { font-size: 12px; color: var(--text-primary); overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
    .iar-group .r { font-size: 10.5px; color: var(--text-muted); }
    .iar-group.met  { border-color: rgba(46,216,150,.35); background: var(--green-dim); }
    .iar-group.ia   { border-color: rgba(157,125,255,.35); background: rgba(157,125,255,.08); }

    .iar-hist { display: flex; flex-direction: column; max-height: 240px; overflow-y: auto; }
    .iar-histrow { display: grid; grid-template-columns: 80px 90px 56px 1fr 140px; gap: .6rem;
                   align-items: baseline; padding: .45rem 0; font-size: 11.5px;
                   border-bottom: 1px solid var(--border-dim); }
    .iar-histrow .r { color: var(--blue); }
    .iar-histrow .s { text-transform: capitalize; }
    .iar-histrow .s.accepted { color: var(--green); }
    .iar-histrow .s.rejected { color: var(--red); }
    .iar-histrow .s.submitted { color: var(--amber); }
    .iar-histrow .p, .iar-histrow .b, .iar-histrow .w { color: var(--text-muted); }

    @media (max-width: 900px) {
      .iar-idents { grid-template-columns: 1fr; }
      .iar-case { grid-template-columns: 1fr 1fr; }
      .iar-case .y { grid-column: span 2; }
      .iar-histrow { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 620px) {
      .iar-wrap { padding: 1rem .8rem 6rem; }
      .iar-row { gap: .5rem; }
    }
  </style>
</head>
<body>
  <div class="aurora"><div class="aurora-blob a1"></div><div class="aurora-blob a2"></div></div>

  <div class="iar-wrap">
    <div class="iar-head">
      <div>
        <div class="iar-title">Internal Affairs Applications</div>
        <div class="iar-sub" id="iar-sub">Deputy Director and above</div>
      </div>
      <span class="spacer"></span>
      <a class="btn btn-ghost btn-sm" href="/ia/dashboard"><i class="ti ti-arrow-left"></i> Dashboard</a>
    </div>

    <!-- Whether applications are being taken at all. Deputy Director and above,
         the same gate the rest of this page is behind. Closing it keeps every
         draft and every application already submitted; it only stops new ones. -->
    <div class="iar-gate" id="iar-gate" style="display:none;">
      <div class="iar-gate-main">
        <div class="iar-gate-state" id="iar-gate-state">—</div>
        <div class="iar-gate-sub" id="iar-gate-sub"></div>
      </div>
      <input type="text" class="form-control iar-gate-note" id="iar-gate-note" maxlength="300"
             placeholder="What applicants are told while closed (optional)" autocomplete="off" />
      <button class="btn btn-sm" id="iar-gate-btn"></button>
    </div>

    <div id="iar-body"><div class="iar-state"><div class="spinner"></div></div></div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/ui.js?v=1"></script>
  <script src="/js/ia-applications.js?v=1"></script>
</body>
</html>

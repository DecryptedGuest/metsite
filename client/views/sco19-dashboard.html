<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MET · SCO-19 Dashboard</title>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("iacms_theme")||"dark");</script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/aurora.css" />
  <link rel="stylesheet" href="/css/met-portal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
</head>
<body>
<div class="bg-canvas">
  <div class="bg-grid"></div><div class="bg-glow-1"></div><div class="bg-glow-2"></div><div class="bg-scanline"></div>
</div>

<div class="met-topbar">
  <div class="met-topbar-left">
    <img src="/img/logo.png" class="met-topbar-logo" alt="MET" />
    <div class="met-topbar-title">
      <span class="met-topbar-brand">Metropolitan Police Service</span>
      <span class="met-topbar-division" id="met-division-badge">SCO-19</span>
    </div>
  </div>
  <div class="met-topbar-right">
    <div class="met-switcher" id="met-switcher">
      <button class="btn btn-ghost btn-sm" id="met-switcher-btn"><i class="ti ti-apps"></i> Switch Division</button>
      <div class="met-switcher-menu" id="met-switcher-menu"></div>
    </div>
    <div class="met-topbar-user">
      <img id="met-user-avatar" class="met-user-avatar" src="" alt="" style="display:none;" />
      <div class="met-user-avatar-fallback" id="met-user-avatar-fallback">?</div>
      <span id="met-user-name">Loading…</span>
    </div>
    <form action="/auth/logout" method="POST"><button type="submit" class="btn btn-icon btn-ghost" title="Sign out"><i class="ti ti-logout"></i></button></form>
  </div>
</div>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <div class="brand-logo"><img src="/img/logo.png" alt="SCO-19" /></div>
        <div class="brand-text">
          <div class="brand-name">MET · SCO-19</div>
          <div class="brand-sub">Specialist Firearms</div>
        </div>
      </div>
      <div class="sidebar-divider"></div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Overview</div>
        <button class="nav-item active" data-page="dashboard"><i class="ti ti-layout-dashboard nav-icon"></i><span>Dashboard</span></button>
      </nav>
    </div>
  </aside>

  <main class="main-content">
    <section class="page active" id="page-dashboard">
      <div class="page-header fade-up">
        <div><h1 class="page-title">Specialist Firearms</h1><p class="page-sub">SCO-19 · Overview</p></div>
      </div>
      <div class="panel glass fade-up stagger-1">
        <div style="padding:3rem 1.5rem;text-align:center;color:var(--text-secondary);">
          <div style="font-size:40px;margin-bottom:1rem;">🚧</div>
          <div style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:0.5rem;">More features coming soon</div>
          <div style="font-size:13px;max-width:440px;margin:0 auto;line-height:1.7;">SCO-19 tools are being built. You have access to this division — check back soon for its features.</div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="toast-container"></div>
<script src="/js/ui.js"></script>
<script src="/js/met-topbar.js"></script>
<script src="/js/command-palette.js"></script>
<script>initMetTopbar('SCO19');</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Document · MET Internal Affairs</title>
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("iacms_theme")||"dark");</script>
  <link rel="stylesheet" href="/css/main.css?v=73" />
  <!-- MET emoji: the fallback map (generated from scripts/emoji/manifest.js)
       and the met.e() helper. In <head> and unconditional so every later
       script can call met.e() without ordering games. -->
  <script src="/js/emoji-map.js?v=1"></script>
  <script src="/js/emoji.js?v=1"></script>
  <link rel="stylesheet" href="/css/dashboard.css?v=73" />
  <link rel="stylesheet" href="/css/case-doc.css?v=73" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
</head>
<body>
<div class="bg-canvas">
  <div class="bg-grid"></div>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
</div>

<div class="cd-page">
  <header class="cd-page-bar">
    <a class="cd-page-back" href="/ia/dashboard"><i class="ti ti-arrow-left"></i> Dashboard</a>
    <div class="cd-page-id">
      <span id="cd-page-ref">Case document</span>
      <small id="cd-page-sub">Internal Affairs</small>
    </div>
    <div class="cd-page-actions">
      <button class="btn btn-ghost btn-sm" id="cd-page-copy"><i class="ti ti-link"></i> Copy link</button>
      <button class="btn btn-ghost btn-sm" id="cd-page-print"><i class="ti ti-printer"></i> Print</button>
      <a class="btn btn-ghost btn-sm" id="cd-page-case" style="display:none;"><i class="ti ti-folder"></i> Open case</a>
      <button class="btn btn-primary btn-sm" id="cd-page-edit" style="display:none;"><i class="ti ti-pencil"></i> Edit</button>
    </div>
  </header>

  <main class="cd-page-body" id="cd-page-body">
    <div class="table-loading" style="padding:4rem;"><div class="spinner"></div></div>
  </main>
</div>

<!-- The builder overlay, shared with the dashboard. -->
<div class="modal-overlay cd-overlay" id="modal-case-doc">
  <div class="modal glass-bright cd-modal">
    <div class="modal-header cd-modal-header">
      <div class="modal-title">
        <i class="ti ti-file-text" style="font-size:18px;"></i>
        <span>Case Document</span>
        <span class="cd-docref" id="cd-docref">Unsaved draft</span>
      </div>
      <div class="cd-modal-actions">
        <span class="cd-status" id="cd-status"></span>
        <a class="btn btn-ghost btn-sm" id="cd-openlink" target="_blank" rel="noopener" style="display:none;"><i class="ti ti-external-link"></i> Open</a>
        <button class="btn btn-ghost btn-sm" id="cd-print-btn"><i class="ti ti-printer"></i> Print</button>
        <button class="btn btn-ghost btn-sm" id="cd-preview-btn"><i class="ti ti-eye"></i> Preview</button>
        <button class="btn btn-ghost btn-sm" id="cd-save-btn"><i class="ti ti-device-floppy"></i> Save</button>
        <button class="btn btn-primary btn-sm" id="cd-attach-btn"><i class="ti ti-link"></i> Use in this case</button>
        <button class="modal-close" onclick="closeModal('modal-case-doc')">&#x2715;</button>
      </div>
    </div>
    <div class="modal-body cd-modal-body">
      <div id="cd-edit-wrap"></div>
      <div id="cd-preview-wrap" style="display:none;"></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/ui.js?v=73"></script>
<script src="/js/panel-collapse.js?v=1"></script>
<script src="/js/case-doc.js?v=73"></script>
<script>
(async function () {
  var m = location.pathname.match(/\/case-doc\/([^/?#]+)/);
  var id = m ? decodeURIComponent(m[1]) : null;
  var body = document.getElementById('cd-page-body');
  if (!id) { body.innerHTML = '<div class="cd-page-error">No document specified.</div>'; return; }

  var doc = null;
  try {
    doc = await api('/api/case-docs/' + id);
  } catch (err) {
    body.innerHTML = '<div class="cd-page-error"><i class="ti ti-file-off"></i> '
      + (err.message || 'That document could not be loaded.') + '</div>';
    return;
  }

  document.getElementById('cd-page-ref').textContent = doc.docRef || 'Case document';
  document.getElementById('cd-page-sub').textContent =
    'Internal Affairs · ' + (doc.author || 'Unknown') + (doc.status === 'FINAL' ? ' · Final' : ' · Draft');
  document.title = (doc.title || 'Case Document') + ' · MET Internal Affairs';
  body.innerHTML = CaseDoc.renderDocumentHtml(doc);

  if (doc.caseId) {
    var link = document.getElementById('cd-page-case');
    link.href = '/ia/dashboard?case=' + doc.caseId;
    link.style.display = '';
  }
  if (doc.canEdit) {
    var edit = document.getElementById('cd-page-edit');
    edit.style.display = '';
    edit.addEventListener('click', function () {
      CaseDoc.openBuilder({ docId: doc.id, onSaved: function () { location.reload(); } });
    });
  }
  // ?edit=1 opens straight into the builder.
  if (doc.canEdit && new URLSearchParams(location.search).get('edit') === '1') {
    CaseDoc.openBuilder({ docId: doc.id, onSaved: function () { location.reload(); } });
  }

  document.getElementById('cd-page-copy').addEventListener('click', function () {
    var url = location.origin + '/case-doc/' + doc.id;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { showToast('Link copied.', 'success'); },
                                             function () { prompt('Copy this link:', url); });
    } else prompt('Copy this link:', url);
  });
  document.getElementById('cd-page-print').addEventListener('click', function () { window.print(); });
})();
</script>
</body>
</html>

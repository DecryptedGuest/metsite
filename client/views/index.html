<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metropolitan Police Service · Sign in</title>

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Metropolitan Police Service" />
  <meta property="og:title" content="Metropolitan Police Service" />
  <meta property="og:description" content="Officer dashboard — quota, disciplinary record, divisions and more." />
  <meta name="theme-color" content="#4a8fff" />

  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("iacms_theme")||"dark");</script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/aurora.css" />
  <link rel="stylesheet" href="/css/met-portal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .signin-wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; padding: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 1.6rem; }
    .signin-crest { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; animation: fadeUp 0.6s ease both; }
    .signin-crest img { width: 88px; height: 88px; border-radius: 16px; box-shadow: 0 0 40px rgba(20,60,200,0.28); }
    .signin-title { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-primary); text-align: center; }
    .signin-sub { font-size: 12px; color: var(--text-muted); letter-spacing: 0.14em; text-transform: uppercase; text-align: center; margin-top: -0.4rem; }
    .signin-card { width: 100%; padding: 1.6rem 1.6rem 1.4rem; animation: fadeUp 0.6s ease 0.1s both; }
    .signin-card .hint { text-align: center; font-size: 11px; color: var(--text-tiny); margin-top: 0.9rem; }
    .btn-discord-full { width: 100%; justify-content: center; padding: 0.85rem 1.4rem; font-size: 14px; border-radius: var(--radius-md); }
    .signin-btns { display: flex; flex-direction: column; gap: 10px; }
    .btn-roblox { background:#fff; color:#111; border:1px solid rgba(255,255,255,0.15); }
    .btn-roblox:hover { background:#e9e9e9; color:#000; }
    .signin-or { display:flex; align-items:center; gap:10px; margin:2px 0; color:var(--text-tiny); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; }
    .signin-or::before, .signin-or::after { content:""; flex:1; height:1px; background:rgba(255,255,255,0.08); }
    .signin-footer { font-family: var(--font-mono); font-size: 9px; color: var(--text-tiny); letter-spacing: 0.12em; text-transform: uppercase; }
  </style>
</head>
<body>
<div class="bg-canvas">
  <div class="bg-grid"></div><div class="bg-glow-1"></div><div class="bg-glow-2"></div><div class="bg-scanline"></div>
</div>

<div class="signin-wrap">
  <div class="signin-crest">
    <img id="signin-logo" src="/img/logo.png" alt="MET Police" />
    <div>
      <div class="signin-title">Metropolitan Police Service</div>
      <div class="signin-sub">Officer Dashboard</div>
    </div>
  </div>

  <div id="error-banner" class="error-banner" style="display:none;width:100%;">
    <i class="ti ti-alert-triangle"></i><span id="error-text">An error occurred.</span>
  </div>

  <div class="signin-card glass-bright">
    <div class="signin-btns">
      <a href="/auth/discord" class="btn btn-discord btn-discord-full">
        <svg width="18" height="18" viewBox="0 0 127.14 96.36" fill="currentColor" style="vertical-align:-3px;margin-right:6px;"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
        Sign in with Discord
      </a>
      <div class="signin-or">or</div>
      <a href="/auth/roblox" class="btn btn-roblox btn-discord-full">
        <i class="ti ti-brand-roblox" style="font-size:18px;margin-right:6px;vertical-align:-3px;"></i>
        Sign in with Roblox
      </a>
    </div>
    <div class="hint">You must be a member of the MET Discord server. Either option signs you into the same account.</div>
  </div>

  <div class="signin-footer">Metropolitan Police Service · Authorised personnel only</div>
</div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const err = params.get('error');
  if (err) {
    const messages = {
      oauth_cancelled:   'Discord authorisation was cancelled.',
      token_failed:      'Failed to exchange Discord token. Please try again.',
      user_fetch_failed: 'Could not retrieve your Discord profile.',
      server_error:      'A server error occurred. Please try again.',
      access_revoked:    'Your access has changed. Please sign in again.',
      no_role:           'Your Discord account does not have access to the MET Dashboard.',
      not_in_server:     'You must be a member of the MET Discord server.',
      oauth_state:       'Sign-in session expired. Please try again.',
      roblox_not_configured: 'Roblox sign-in isn\'t set up yet. Use Discord for now.',
      roblox_unlinked:   'Your Roblox account isn\'t linked to Discord (via RoVer). Sign in with Discord, or verify with RoVer first.',
    };
    document.getElementById('error-text').textContent = messages[err] || 'An error occurred.';
    document.getElementById('error-banner').style.display = 'flex';
  } else {
    // Already signed in? Go straight to the dashboard.
    fetch('/api/me', { credentials: 'include' })
      .then(r => { if (r.ok) location.replace('/dashboard'); })
      .catch(() => {});
  }
  // Use the MET group icon as the crest if it's reachable (falls back to logo.png).
  fetch('/api/me/divisions', { credentials: 'include' }).then(r => r.ok ? r.json() : null)
    .then(d => { if (d && d.metIcon) document.getElementById('signin-logo').src = d.metIcon; }).catch(() => {});
})();
</script>
</body>
</html>

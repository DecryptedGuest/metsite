<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metropolitan Police Service · Portal</title>

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Metropolitan Police Service" />
  <meta property="og:title" content="Metropolitan Police Service · Portal" />
  <meta property="og:description" content="CID · SCO-19 · Internal Affairs · Frontline Policing · Hendon Police College" />
  <meta name="theme-color" content="#4a8fff" />

  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("iacms_theme")||"dark");</script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/aurora.css" />
  <link rel="stylesheet" href="/css/met-portal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <style>
    body { overflow-y: auto; overflow-x: hidden; }
    .hub-top-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 1rem 1.5rem 0; position: relative; z-index: 1; }
  </style>
</head>
<body>
<div class="bg-canvas">
  <div class="bg-grid"></div>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-scanline"></div>
</div>

<div class="hub-top-actions" id="hub-top-actions" style="display:none;">
  <span id="hub-user-name" style="font-size:12px;color:var(--text-secondary);align-self:center;"></span>
  <a href="/profile" class="btn btn-ghost btn-sm"><i class="ti ti-user"></i> My Profile</a>
  <form action="/auth/logout" method="POST">
    <button type="submit" class="btn btn-ghost btn-sm"><i class="ti ti-logout"></i> Sign out</button>
  </form>
</div>

<div class="hub-wrap">
  <div class="hub-hero">
    <img src="/img/logo.png" alt="MET Police" />
    <div class="hub-title">Metropolitan Police Service</div>
    <div class="hub-subtitle">Division Portal</div>

    <div id="error-banner" class="error-banner" style="display:none;max-width:420px;margin:1.2rem auto 0;">
      <i class="ti ti-alert-triangle"></i>
      <span id="error-text">An error occurred.</span>
    </div>

    <div class="hub-signin" id="hub-signin" style="display:none;">
      <a href="/auth/discord" class="btn btn-discord">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-3px;margin-right:4px;"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.033.056A19.9 19.9 0 0 0 6.1 21.025a.077.077 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        Sign in with Discord
      </a>
    </div>
  </div>

  <div class="hub-grid" id="hub-grid">
    <div class="table-loading" style="grid-column:1/-1;"><div class="spinner"></div></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/ui.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const err = params.get('error');
  if (err) {
    const messages = {
      oauth_cancelled:   'Discord authorisation was cancelled.',
      token_failed:      'Failed to exchange Discord token. Please try again.',
      user_fetch_failed: 'Could not retrieve your Discord profile.',
      server_error:      'A server error occurred. Please try again.',
      access_revoked:    'Your access has changed. Please sign in again.',
    };
    document.getElementById('error-text').textContent = messages[err] || 'An error occurred.';
    document.getElementById('error-banner').style.display = 'flex';
  }
})();

async function loadHub() {
  const grid = document.getElementById('hub-grid');
  let me = null, divisionsData = null;
  try { me = await fetch('/api/me', { credentials: 'include' }).then(r => r.ok ? r.json() : null); } catch (e) {}

  if (me) {
    document.getElementById('hub-signin').style.display = 'none';
    document.getElementById('hub-top-actions').style.display = 'flex';
    document.getElementById('hub-user-name').textContent = me.displayName || me.discordUsername;
    try { divisionsData = await fetch('/api/me/divisions', { credentials: 'include' }).then(r => r.ok ? r.json() : null); } catch (e) {}
  } else {
    document.getElementById('hub-signin').style.display = 'block';
  }

  const all = (divisionsData && divisionsData.all) || [
    { division: 'CID',   slug: 'cid',   name: 'CID',    fullName: 'Criminal Investigation Department' },
    { division: 'SCO19', slug: 'sco19', name: 'SCO-19', fullName: 'Specialist Firearms Command' },
    { division: 'IA',    slug: 'ia',    name: 'IA',     fullName: 'Internal Affairs' },
    { division: 'FLP',   slug: 'flp',   name: 'FLP',    fullName: 'Frontline Policing' },
    { division: 'HPC',   slug: 'hpc',   name: 'HPC',    fullName: 'Hendon Police College' },
  ];
  const mineByDivision = {};
  ((divisionsData && divisionsData.mine) || []).forEach(d => { mineByDivision[d.division] = d; });

  grid.innerHTML = '';
  all.forEach((d, i) => {
    const mine = mineByDivision[d.division];
    const hasAccess = !!(me && mine);
    const card = document.createElement('div');
    card.className = 'glass hub-card fade-up' + (hasAccess ? '' : ' locked') + ` stagger-${(i % 4) + 1}`;

    // Division icon comes from the holder account's Roblox group; fall back to
    // the abbreviation badge when no icon has resolved (e.g. group id unset).
    const icon = d.icon
      ? `<img class="hub-card-icon" src="${d.icon}" alt="${d.name}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'hub-card-abbr',textContent:'${d.name}'}))" />`
      : `<div class="hub-card-abbr">${d.name}</div>`;

    // Rank line shows the user's actual Roblox rank name + tier in the division.
    let rankLine = '';
    if (hasAccess) {
      const tierLabel = mine.tier === 'LEAD' ? 'Lead' : 'Member';
      rankLine = `<div class="hub-card-rank">${mine.rankName ? escHtml(mine.rankName) + ' · ' : ''}${tierLabel}</div>`;
    }

    card.innerHTML = `
      <div class="hub-card-head">${icon}<div class="hub-card-name">${d.fullName}</div></div>
      <div class="hub-card-desc">${describeDivision(d.division)}</div>
      ${rankLine}
      <div>
        ${!me
          ? `<a href="/auth/discord" class="btn btn-primary btn-sm">Sign in</a>`
          : hasAccess
            ? `<a href="/${d.slug}/dashboard" class="btn btn-primary btn-sm">Enter</a>`
            : `<button class="btn btn-ghost btn-sm" disabled>No access</button>`}
      </div>`;
    grid.appendChild(card);
  });
}

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function describeDivision(division) {
  return {
    CID:   'Open cases, log evidence and notes, and track investigations through to closure.',
    SCO19: 'Log firearms deployments and authorisations, with lead sign-off on every operation.',
    IA:    'Case management, ticketing, quota tracking and the audit log for Internal Affairs.',
    FLP:   'Log shifts, incidents attended and arrests made on the frontline.',
    HPC:   'Track cadet enrolment, course completion, and graduation sign-off.',
  }[division] || '';
}

loadHub();
</script>
</body>
</html>

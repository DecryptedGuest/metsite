<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MET · Application Review</title><link rel="stylesheet" href="/css/met.css?v=10"><style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui)}.wrap{max-width:1100px;margin:0 auto;padding:32px 20px}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:18px}.item{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.item:hover{background:var(--surface-alt)}.muted{color:var(--ink-muted);font-size:12px}.answer{white-space:pre-wrap;line-height:1.6;padding:12px;background:var(--surface-alt);border-radius:5px;margin:8px 0 14px}.btn{padding:9px 13px;border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;cursor:pointer;color:var(--ink)}.btn.primary{background:#20252b;color:#fff}.btn.danger{border-color:#a95a54;color:#963e39}textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink)}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>MET Applications</h1><p class="muted">MET High Command · Recruitment review</p><div class="layout"><section class="panel"><h3>Queue</h3><div id="queue">Loading…</div></section><section class="panel"><div id="detail" class="muted">Select an application to review.</div></section></div></main><script src="/js/met-applications.js?v=1"></script></body></html>

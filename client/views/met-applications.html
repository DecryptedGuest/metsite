<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MET Application Review · HPC</title><link rel="stylesheet" href="/css/met.css?v=11"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1017;color:#e8edf3;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.wrap{max-width:1280px;margin:auto;padding:34px 24px 60px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid #273340;padding-bottom:22px;margin-bottom:22px}.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#91a1b3;font-weight:700}h1{font-size:30px;letter-spacing:-.04em;margin:8px 0 5px}.sub{font-size:13px;color:#91a0af}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}.panel{background:#111a24;border:1px solid #273442;border-radius:11px;padding:18px;min-width:0}.panel h2{font-size:13px;letter-spacing:.02em;margin:0 0 15px}.queue-tools{display:flex;gap:7px;margin-bottom:12px}.queue-tools input{width:100%;background:#0b131c;border:1px solid #344353;border-radius:7px;color:#e7edf3;padding:10px;font-size:12px}.item{padding:13px;border:1px solid transparent;border-radius:8px;cursor:pointer;margin:4px 0}.item:hover{background:#172330}.item.active{background:#1b2a39;border-color:#3b5065}.item strong{font-size:12px}.muted{color:#91a0af;font-size:11px;line-height:1.6}.tag{display:inline-block;border:1px solid #344454;border-radius:99px;padding:3px 8px;font-size:9px;color:#aebdcb;letter-spacing:.06em}.answer{white-space:pre-wrap;line-height:1.7;padding:13px 14px;background:#0d151e;border:1px solid #263443;border-radius:8px;margin:8px 0 16px;color:#cbd4de;font-size:12px}.question-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8e9eae;font-weight:700;margin-top:18px}.btn{padding:10px 15px;border:1px solid #405164;background:#1a2734;border-radius:7px;cursor:pointer;color:#e8edf3;font-size:12px;font-weight:650}.btn.primary{background:#dce5ed;color:#17212b;border-color:#dce5ed}.btn.danger{border-color:#77504e;color:#e1b8b3;background:#251a1b}.btn:disabled{opacity:.45;cursor:not-allowed}textarea{width:100%;min-height:86px;padding:12px;border:1px solid #354657;border-radius:8px;background:#0b141d;color:#e8edf3;font:12px/1.6 inherit}.signals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.signal{background:#0d151e;border:1px solid #293847;border-radius:8px;padding:12px}.signal b{display:block;font-size:18px;margin-bottom:3px}.signal span{font-size:10px;color:#94a2b0}.decision{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.note{font-size:11px;color:#9aa8b6;line-height:1.65;margin-top:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.wrap{padding:22px 13px 40px}}
</style></head><body><main class="wrap"><header class="head"><div><div class="kicker">Hendon Police College / Recruitment</div><h1>MET Application Review</h1><div class="sub">Review the applicant's answers, check the integrity notes, and record a decision.</div></div><span class="tag">HPC ACCESS</span></header><div class="layout"><section class="panel"><h2>Application queue</h2><div class="queue-tools"><input id="queue-search" placeholder="Search reference or username…" autocomplete="off"></div><div id="queue" class="muted">Loading applications…</div></section><section class="panel"><div id="detail" class="muted">Choose an application from the queue to begin.</div></section></div></main><script src="/js/met-applications.js?v=2"></script></body></html>

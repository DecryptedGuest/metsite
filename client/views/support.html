<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MET Support · METAdministration</title>
  <link rel="icon" href="/img/divisions/met.png" />
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("iacms_theme")||"dark");</script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/aurora.css" />
  <link rel="stylesheet" href="/css/met-portal.css?v=78" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <style>
    .sup-wrap { max-width: 1080px; margin: 0 auto; padding: 1.5rem; }
    .sup-panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.3rem; }
    .sup-panel { display: flex; flex-direction: column; gap: 1rem; padding: 1.8rem; transition: border-color .15s ease, transform .15s ease; }
    .sup-panel:hover { transform: translateY(-2px); border-color: var(--blue, #4a8fff); }
    .sup-panel h3 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: .6rem; }
    .sup-panel h3 i { font-size: 24px; }
    .sup-panel p { margin: 0; font-size: 14.5px; color: var(--text-secondary); line-height: 1.65; flex: 1; }
    /* Big, unmissable "open ticket" button — full-width, larger text (overrides btn-sm). */
    .sup-panel .btn { align-self: stretch; justify-content: center; margin-top: .4rem; padding: .95rem 1.4rem; font-size: 15.5px; font-weight: 700; border-radius: 12px; }
    .sup-panel .btn i { font-size: 18px; }
    .sup-restricted { opacity: .75; }
    .sup-locknote { font-size: 11px; color: var(--amber); display: flex; align-items: center; gap: 4px; }
    .sup-section-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin: 1.6rem 0 .7rem; color: var(--text-primary); }
    /* Chat */
    .sup-chat-head { display: flex; align-items: center; gap: 12px; padding: 1rem 1.2rem; }
    .sup-chat-head .sup-back { cursor: pointer; }
    .sup-log { display: flex; flex-direction: column; gap: 12px; padding: 1.2rem; max-height: 58vh; overflow-y: auto; }
    .sup-msg { display: flex; gap: 10px; }
    .sup-msg .sup-av { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 34px; background: var(--surface-2, #222); display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 13px; font-weight: 700; }
    .sup-msg .sup-av img { width: 100%; height: 100%; object-fit: cover; }
    .sup-msg .sup-body { flex: 1; min-width: 0; }
    .sup-msg .sup-meta { font-size: 12px; margin-bottom: 2px; }
    .sup-msg .sup-name { font-weight: 700; }
    .sup-msg .sup-time { color: var(--text-muted); font-size: 11px; margin-left: 6px; }
    .sup-msg .sup-text { font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .sup-msg.bot .sup-name { color: var(--blue); }
    .sup-msg.staff .sup-name { color: var(--green); }
    .sup-atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .sup-atts a, .sup-atts img, .sup-atts video { max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--border, #333); }
    /* Discord-style link embeds (mirrors support-chat.css). */
    .sup-embeds { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .met-embed { position: relative; max-width: 480px; background: var(--surface-2, rgba(255,255,255,.035)); border-left: 4px solid var(--emb, var(--accent, #4a8fff)); border-radius: 6px; padding: 10px 12px; overflow: hidden; }
    .met-emb-main { display: flex; gap: 12px; align-items: flex-start; }
    .met-emb-body { flex: 1; min-width: 0; }
    .met-emb-site { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }
    .met-emb-fav { width: 16px; height: 16px; border-radius: 3px; object-fit: cover; }
    .met-emb-title { display: block; font-size: 15px; font-weight: 600; color: var(--accent, #4a8fff); line-height: 1.3; margin-bottom: 4px; text-decoration: none; word-break: break-word; }
    .met-emb-title:hover { text-decoration: underline; }
    .met-emb-desc { font-size: 13px; color: var(--text-secondary, #b9c2d0); line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .met-emb-thumb { flex-shrink: 0; }
    .met-emb-thumb img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; display: block; }
    .met-emb-big { display: block; margin-top: 10px; border-radius: 6px; overflow: hidden; position: relative; }
    .met-emb-big img { display: block; width: 100%; max-height: 300px; object-fit: cover; }
    .met-emb-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .met-emb-play i { font-size: 30px; color: #fff; background: rgba(0,0,0,.55); width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .met-embed-img { border-left: none; background: none; padding: 0; }
    .met-embed-img img { max-width: 100%; max-height: 320px; border-radius: 8px; display: block; cursor: pointer; }
    .sup-drop { outline: 2px dashed var(--accent, #4a8fff); outline-offset: 2px; border-radius: 10px; background: color-mix(in srgb, var(--accent, #4a8fff) 8%, transparent); }
    .sup-composer { display: flex; flex-direction: column; gap: 8px; padding: 1rem 1.2rem; border-top: 1px solid var(--border, #2a2a2a); }
    .sup-composer-row { display: flex; gap: 8px; align-items: flex-end; }
    .sup-composer textarea { flex: 1; resize: vertical; min-height: 44px; }
    .sup-pending-atts { display: flex; flex-wrap: wrap; gap: 8px; }
    .sup-att-tile { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px; border: 1px solid var(--border, #333); border-radius: 9px; background: rgba(255,255,255,.03); max-width: 240px; }
    .sup-att-tile.error { border-color: var(--red, #e0503a); }
    .sup-att-thumb { position: relative; width: 40px; height: 40px; border-radius: 7px; overflow: hidden; flex: 0 0 40px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.05); color: var(--text-muted); font-size: 18px; }
    .sup-att-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .sup-att-spin { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.45); }
    .sup-att-spin .spinner { width: 18px; height: 18px; }
    .sup-att-info { min-width: 0; flex: 1; }
    .sup-att-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sup-att-status { font-size: 10px; color: var(--text-muted); }
    .sup-att-tile.error .sup-att-status { color: var(--red, #e0503a); }
    .sup-att-rm { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px; display: flex; }
    .sup-att-rm:hover { color: var(--red, #e0503a); }
    .sup-hint { font-size: 11px; color: var(--text-muted); }
    .sup-hidden { display: none !important; }
    /* System transition panels (transferred to IA, claimed, closed) */
    .sup-msg-sys { display: flex; justify-content: center; }
    .sup-sys { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border: 1px solid var(--border, #333); border-radius: 12px; background: rgba(74,143,255,.06); max-width: 460px; }
    /* Typing indicator */
    .sup-typing { display: inline-flex; gap: 4px; align-items: center; height: 18px; }
    .sup-typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); opacity: .4; animation: sup-blink 1.2s infinite both; }
    .sup-typing span:nth-child(2) { animation-delay: .2s; }
    .sup-typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes sup-blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
    /* Resolved-person card */
    .sup-idcard { display: flex; gap: 12px; align-items: center; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--border, #333); border-radius: 10px; max-width: 340px; background: rgba(255,255,255,.02); }
    .sup-idcard:hover { border-color: var(--blue, #4a8fff); }
    /* Confirmation buttons after a choice is made */
    .sup-btn-done { opacity: .4; }
    .sup-btn-chosen { opacity: 1; }
    .sup-av[onclick]:hover, .sup-name[onclick]:hover { filter: brightness(1.15); text-decoration: underline; }
  </style>
  <link rel="stylesheet" href="/css/enhance.css?v=4" />
</head>
<body>
<div class="bg-canvas">
  <div class="bg-grid"></div><div class="bg-glow-1"></div><div class="bg-glow-2"></div><div class="bg-scanline"></div>
</div>

<div class="met-topbar">
  <div class="met-topbar-left">
    <img src="/img/divisions/met.png" class="met-topbar-logo" alt="MET" />
    <div class="met-topbar-title">
      <span class="met-topbar-brand">Metropolitan Police Service</span>
      <span class="met-topbar-division">Support</span>
    </div>
  </div>
  <div class="met-topbar-right">
    <div class="met-topbar-user">
      <img id="sup-user-avatar" class="met-user-avatar" src="" alt="" style="display:none;width:26px;height:26px;border-radius:50%;" />
      <div class="met-user-avatar-fallback" id="sup-user-fallback">?</div>
      <span id="sup-user-name">Loading…</span>
    </div>
    <form action="/auth/logout" method="POST"><button type="submit" class="btn btn-icon btn-ghost" title="Sign out"><i class="ti ti-logout"></i></button></form>
  </div>
</div>

<div class="sup-wrap">
  <!-- LANDING -->
  <section id="sup-landing">
    <div class="page-header fade-up" style="margin-bottom:1rem;">
      <div>
        <h1 class="page-title">MET Support</h1>
        <p class="page-sub">Need help? Pick an option below. No account needed.</p>
      </div>
    </div>

    <div class="sup-panels" id="sup-panels"><div class="table-loading"><div class="spinner"></div></div></div>

    <div class="sup-section-title">My Tickets</div>
    <div class="panel glass"><div id="sup-mytickets"><div class="table-loading"><div class="spinner"></div></div></div></div>

    <div id="sup-staff-wrap" class="sup-hidden">
      <div class="sup-section-title">Staff Queue</div>
      <div class="panel glass">
        <div class="panel-header">
          <div class="panel-title"><span class="panel-dot amber"></span>Tickets to handle</div>
          <div class="filter-tabs" id="sup-queue-tabs">
            <button class="filter-tab active" data-status="active">Active</button>
            <button class="filter-tab" data-status="OPEN">Unclaimed</button>
            <button class="filter-tab" data-status="CLAIMED">Claimed</button>
            <button class="filter-tab" data-status="CLOSED">Closed</button>
          </div>
        </div>
        <div id="sup-queue"><div class="table-loading"><div class="spinner"></div></div></div>
      </div>
    </div>
  </section>

  <!-- TICKET / CHAT -->
  <section id="sup-ticket" class="sup-hidden">
    <div class="panel glass" style="overflow:hidden;padding:0;">
      <div class="sup-chat-head">
        <button class="btn btn-icon btn-ghost sup-back" onclick="supBackToLanding()" title="Back"><i class="ti ti-arrow-left"></i></button>
        <div style="flex:1;">
          <div style="font-weight:700;" id="sup-t-title">Ticket</div>
          <div style="font-size:12px;color:var(--text-muted);" id="sup-t-sub"></div>
        </div>
        <span id="sup-t-status" class="badge badge-pending"><span class="badge-dot"></span>—</span>
        <div id="sup-t-actions" style="display:flex;gap:6px;"></div>
      </div>
      <div class="sup-log" id="sup-log"></div>
      <div class="sup-composer" id="sup-composer">
        <div class="sup-pending-atts" id="sup-pending"></div>
        <div class="sup-composer-row">
          <div class="form-control rc-editor" id="sup-input" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Type a message…"></div>
          <input type="file" id="sup-file" accept="image/*,video/*" multiple class="sup-hidden" />
          <button class="btn btn-ghost btn-icon" id="sup-attach-btn" title="Attach"><i class="ti ti-paperclip"></i></button>
          <button class="btn btn-primary" id="sup-send-btn" title="Send message" aria-label="Send message"><i class="ti ti-send"></i></button>
        </div>
        <div class="sup-hint" id="sup-hint"></div>
      </div>
    </div>
  </section>
</div>

<!-- PROFILE CARD -->
<div class="modal-overlay" id="modal-sup-profile">
  <div class="modal glass-bright" style="max-width:420px;">
    <div class="modal-header">
      <div class="modal-title" id="sup-prof-title">Profile</div>
      <button class="modal-close" onclick="closeModal('modal-sup-profile')" title="Close" aria-label="Close"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="sup-prof-body"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/ui.js?v=76"></script>
<script src="/js/met-topbar.js?v=3"></script>
<script src="/js/command-palette.js"></script>
<script src="/js/discord-format.js?v=1"></script>
<script src="/js/support.js?v=6"></script>
<script>initMetTopbar('');</script>
</body>
</html>

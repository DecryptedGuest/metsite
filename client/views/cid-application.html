<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CID Application | Metropolitan Police Service</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"><style>
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:system-ui,sans-serif}.wrap{max-width:920px;margin:0 auto;padding:42px 20px 80px}.head{border-bottom:1px solid var(--border);padding-bottom:22px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}h1{font-size:28px;margin:8px 0;font-weight:650}.sub{color:var(--text-muted);font-size:13px;line-height:1.7}.section{margin:26px 0}.section h2{font-size:16px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--border)}.q{padding:14px 0;border-bottom:1px solid var(--border)}.q label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.q p{font-size:12px;color:var(--text-muted);margin:0 0 8px;line-height:1.6}input,textarea{width:100%;box-sizing:border-box;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:11px;font:13px system-ui}textarea{min-height:100px;resize:vertical}.check{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.6;padding:9px 0}.check input{width:auto;margin-top:3px}.btn{border:1px solid var(--border);border-radius:8px;padding:11px 16px;background:var(--surface);color:var(--text-primary);font-weight:600;cursor:pointer}.btn.primary{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}.notice{padding:14px;border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:13px;line-height:1.7;margin:16px 0}.status{font-size:13px;color:var(--text-muted);margin-top:14px}.actions{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">Metropolitan Police Service / Criminal Investigation Department</div><h1>CID Application</h1><p class="sub">Complete every required question. Your application will be reviewed by CID leadership. Submission does not guarantee acceptance.</p></header><div id="cid-apply-root"><div class="notice">Checking your eligibility…</div></div></main><script src="/js/cid-application.js"></script></body></html>

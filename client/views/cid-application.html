<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CID Applications | Metropolitan Police Service</title><meta name="description" content="Criminal Investigation Department"><meta property="og:type" content="website"><meta property="og:site_name" content="Metropolitan Police Service"><meta property="og:title" content="CID Applications"><meta property="og:description" content="Criminal Investigation Department"><meta property="og:url" content="https://slrmet.com/apply/cid"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="CID Applications"><meta name="twitter:description" content="Criminal Investigation Department"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"><style>
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:system-ui,sans-serif}.wrap{max-width:920px;margin:0 auto;padding:42px 20px 80px}.head{border-bottom:1px solid var(--border);padding-bottom:22px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}h1{font-size:28px;margin:8px 0;font-weight:650}.sub{color:var(--text-muted);font-size:13px;line-height:1.7}.section{margin:26px 0}.section h2{font-size:16px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--border)}.q{padding:14px 0;border-bottom:1px solid var(--border)}.q label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.q p{font-size:12px;color:var(--text-muted);margin:0 0 8px;line-height:1.6}input,textarea{width:100%;box-sizing:border-box;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:11px;font:13px system-ui}textarea{min-height:100px;resize:vertical}.check{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.6;padding:9px 0}.check input{width:auto;margin-top:3px}.btn{border:1px solid var(--border);border-radius:8px;padding:11px 16px;background:var(--surface);color:var(--text-primary);font-weight:600;cursor:pointer}.btn.primary{background:var(--text-primary);color:var(--bg-base);border-color:var(--text-primary)}.btn.primary:disabled{background:var(--text-primary);color:var(--bg-base);border-color:var(--text-primary);opacity:1;cursor:not-allowed}.notice{padding:14px;border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:13px;line-height:1.7;margin:16px 0}.status{font-size:13px;color:var(--text-muted);margin-top:14px}.actions{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.identity-card{margin:18px 0 22px;padding:20px;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.08)}.identity-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.identity-kicker{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-muted);font-weight:700}.identity-heading h2{font-size:17px;margin:4px 0 0;font-weight:650}.identity-lock{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--border);border-radius:999px;color:var(--text-muted);font-size:11px;white-space:nowrap}.identity-lock i{font-size:14px}.identity-caption{font-size:12px;color:var(--text-muted);line-height:1.6;margin:9px 0 16px}.identity-profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.identity-profile{display:flex;align-items:center;gap:12px;min-width:0;padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--bg-base)}.identity-avatar{width:52px;height:52px;flex:0 0 52px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}.discord-avatar{border-radius:15px}.identity-fallback{display:grid;place-items:center;background:var(--surface);color:var(--text-muted);font-size:20px;font-weight:700}.identity-details{display:flex;flex-direction:column;min-width:0;gap:2px}.identity-platform{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted)}.identity-platform i{font-size:15px}.identity-details strong{font-size:13px;overflow-wrap:anywhere}.identity-details small{font-size:11px;color:var(--text-muted)}.declaration-list{display:grid;gap:9px;margin-top:12px}.custom-check{position:relative;display:flex!important;align-items:flex-start;gap:11px;padding:13px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer;transition:border-color .16s ease,background .16s ease}.custom-check:hover{border-color:var(--border-bright);background:var(--bg-panel)}.custom-check input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.checkmark{width:21px;height:21px;flex:0 0 21px;display:grid;place-items:center;border:1.5px solid var(--border-bright);border-radius:6px;background:var(--bg-base);color:transparent;transition:background .16s ease,border-color .16s ease,color .16s ease}.checkmark i{font-size:15px;font-weight:700}.custom-check input:checked+.checkmark{background:var(--blue);border-color:var(--blue);color:#fff}.custom-check input:focus-visible+.checkmark{outline:3px solid var(--blue-glow);outline-offset:2px}.check-copy{font-size:12px;line-height:1.65;font-weight:500;margin:0!important}.custom-check:has(input:checked){border-color:var(--border-bright);background:var(--blue-dim)}.final-confirm{margin-top:22px}.final-confirm .check-copy{font-weight:600}@media(max-width:600px){.identity-profiles{grid-template-columns:1fr}.identity-heading{align-items:flex-start;flex-direction:column}.identity-lock{align-self:flex-start}}

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CID Applications | Metropolitan Police Service</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"><style>
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:system-ui,sans-serif}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--border);padding:24px 16px}.brand{font-weight:700;font-size:14px;margin-bottom:28px}.nav{padding:10px 12px;border-radius:8px;background:var(--surface);font-size:13px}.main{padding:34px;max-width:1300px;width:100%;box-sizing:border-box}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:25px;margin:0 0 6px}.muted{color:var(--text-muted);font-size:12px}.btn{border:1px solid var(--border);border-radius:8px;padding:9px 13px;background:var(--surface);color:var(--text-primary);cursor:pointer;font-weight:600}.btn.primary{background:var(--text-primary);color:var(--bg)}.panel{border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:20px;background:var(--surface)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--border);vertical-align:top}.table th{color:var(--text-muted);font-weight:600}.pill{font-size:10px;padding:4px 7px;border:1px solid var(--border);border-radius:20px}.item{padding:14px 0;border-bottom:1px solid var(--border)}.item h3{font-size:14px;margin:0 0 8px}.answer{white-space:pre-wrap;font-size:12px;line-height:1.7;color:var(--text-muted);margin:8px 0}.flag{font-size:11px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;margin:5px 0;color:var(--text-muted)}textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--text-primary);border:1px solid var(--border);border-radius:7px;padding:9px;min-height:65px}.hidden{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--border);padding:12px 18px}.main{padding:20px 14px}.table{display:block;overflow:auto}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">MET / CID</div><div class="nav"><i class="ti ti-inbox"></i> Applications</div></aside><main class="main"><div class="top"><div><div class="muted">Criminal Investigation Department</div><h1>Applications</h1><div class="muted">Review submissions and manage recruitment availability.</div></div><button id="toggle" class="btn primary">Loading…</button></div><section class="panel"><div class="row"><strong>Application responses</strong><span id="count" class="muted"></span></div><div id="responses" class="muted">Loading applications…</div></section></main></div><script src="/js/cid-application-admin.js"></script></body></html>

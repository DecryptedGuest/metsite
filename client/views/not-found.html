<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MET Dashboard · Page Not Found</title>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("iacms_theme")||"dark");</script>
<!-- MET emoji: the fallback map (generated from scripts/emoji/manifest.js)
       and the met.e() helper. In <head> and unconditional so every later
       script can call met.e() without ordering games. -->
  <script src="/js/emoji-map.js?v=1"></script>
  <script src="/js/emoji.js?v=1"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
<link rel="stylesheet" href="/css/system.css?v=1" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .nf-wrap { position: relative; z-index: 1; max-width: 460px; width: 100%; padding: 1rem;
      display: flex; flex-direction: column; align-items: center; gap: 1.6rem; text-align: center; }
    .nf-icon {
      width: 82px; height: 82px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
      font-size: 38px; color: var(--blue, #4a8fff);
      background: rgba(40, 90, 220, 0.16); border: 1px solid rgba(74, 143, 255, 0.28);
      box-shadow: 0 0 46px rgba(30, 80, 220, 0.22);
    }
    .nf-code { font-family: var(--font-mono); font-size: 44px; font-weight: 800; letter-spacing: 0.04em;
      background: linear-gradient(120deg, var(--text-primary) 0%, #8db4ff 55%, var(--purple, #9d7dff) 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; line-height: 1; }
    .nf-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .nf-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
    .nf-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
<div class="bg-canvas">
  <div class="bg-grid"></div><div class="bg-glow-1"></div><div class="bg-glow-2"></div><div class="bg-scanline"></div>
</div>

<div class="nf-wrap">
  <div class="nf-icon fade-up"><i class="ti ti-map-search"></i></div>
  <div class="fade-up stagger-1">
    <div class="nf-code">404</div>
    <div class="nf-title" style="margin-top:8px;">Page Not Found</div>
  </div>
  <div class="nf-sub fade-up stagger-2">
    The page you're looking for doesn't exist or may have moved. Check the address, or head back to your dashboard.
  </div>
  <div class="nf-actions fade-up stagger-2">
    <a href="/" class="btn btn-ghost"><i class="ti ti-home"></i> Back to Hub</a>
    <a href="/profile" class="btn btn-primary"><i class="ti ti-layout-dashboard"></i> My Dashboard</a>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:0;margin-top:.4rem;">
    <div class="met-strap met-strap-hero" data-animate style="font-size:clamp(13px,3vw,17px);">
      <span class="seg">More Trust</span><span class="seg">Less Crime</span><span class="seg">High Standards</span>
    </div>
    <div class="met-strap-underline"></div>
    <div style="font-size:11px;color:var(--text-tiny);letter-spacing:.14em;text-transform:uppercase;margin-top:.7rem;opacity:0;animation:met-splash-tag-in .55s ease 1s forwards;">Working together for a safer London</div>
  </div>
</div>

<script src="/js/ui.js?v=81"></script>

<script src="/js/panel-collapse.js?v=1"></script>
<script src="/js/met-topbar.js?v=3"></script>
<script>setSiteChrome('');</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MET Dashboard · Get the App</title>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("iacms_theme")||"dark");</script>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MET Dashboard" />
  <link rel="apple-touch-icon" href="/img/divisions/met.png" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/aurora.css" />
  <link rel="stylesheet" href="/css/met-portal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <style>
    .app-wrap{max-width:520px;margin:0 auto;padding:28px 20px 60px;}
    .app-card{border:1px solid var(--border,#2a2a2a);border-radius:18px;padding:26px;background:var(--panel,rgba(255,255,255,.02));text-align:center;}
    .app-logo{width:72px;height:72px;border-radius:18px;margin:0 auto 14px;display:block;}
    .qr-box{background:#fff;border-radius:16px;padding:14px;display:inline-block;margin:14px 0;box-shadow:0 8px 30px rgba(0,0,0,.25);}
    .qr-box img{display:block;width:260px;height:260px;}
    .step{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 0;border-bottom:1px solid var(--border,#2a2a2a);}
    .step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--blue,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
    .muted{color:var(--text-muted);font-size:13px;line-height:1.6;}
    .big-btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;margin-top:10px;}
  </style>
</head>
<body>
<div class="bg-canvas"><div class="bg-grid"></div><div class="bg-glow-1"></div><div class="bg-glow-2"></div></div>

<div class="app-wrap">
  <div class="app-card fade-up">
    <img src="/img/divisions/met.png" class="app-logo" alt="MET" />
    <h1 style="font-size:22px;margin:0 0 4px;">MET Dashboard</h1>
    <p class="muted" id="app-sub">Install the dashboard on your phone.</p>
    <div id="app-body" style="margin-top:14px;"><div class="table-loading"><div class="spinner"></div></div></div>
  </div>

  <div style="text-align:center;margin-top:20px;">
    <a href="/profile" class="btn btn-ghost btn-sm"><i class="ti ti-arrow-left"></i> Back to dashboard</a>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/ui.js"></script>
<script src="/js/push-client.js"></script>
<script src="/js/app-install.js"></script>
</body>
</html>

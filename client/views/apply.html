<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MET Application | Metropolitan Police Service</title>
<meta name="description" content="Apply to join the Metropolitan Police Service. Complete the MET application form.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Metropolitan Police Service">
<meta property="og:title" content="MET Application">
<meta property="og:description" content="Metropolitan Police Service application form.">
<meta property="og:url" content="https://slrmet.com/apply">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="MET Application">
<meta name="twitter:description" content="Metropolitan Police Service application form.">
<link rel="icon" type="image/png" href="/img/divisions/met.png?v=1">
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("iacms_theme")||"dark");</script>
<link rel="stylesheet" href="/css/met.css?v=11">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{--apply-ink:#e9edf3;--apply-muted:#929dab;--apply-line:rgba(191,205,222,.14);--apply-panel:#111821;--apply-panel2:#151f2b;--apply-accent:#aebed0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080d13;color:var(--apply-ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(125deg,transparent 0 55%,rgba(121,148,177,.045)),radial-gradient(ellipse at 12% 0%,rgba(90,116,145,.13),transparent 42%)}
.apply-wrap{position:relative;max-width:1040px;margin:auto;padding:38px 24px 76px}
.topline{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--apply-line);padding-bottom:20px;margin-bottom:36px}
.brand{display:flex;align-items:center;gap:13px}.brand img{width:42px;height:42px;object-fit:contain}.brand b{display:block;font-size:13px;letter-spacing:.035em}.brand small{display:block;color:var(--apply-muted);font-size:11px;margin-top:3px}
.topmeta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--apply-muted)}
.hero{display:grid;grid-template-columns:1fr 270px;gap:38px;align-items:end;margin-bottom:26px}
.kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#aab8c8;font-weight:700}
h1{font-size:clamp(30px,4vw,43px);letter-spacing:-.045em;line-height:1.08;margin:12px 0 12px;color:#f4f6f9}
.intro{max-width:630px;color:#a5afbc;line-height:1.75;font-size:14px;margin:0}
.hero-side{border-left:1px solid var(--apply-line);padding-left:22px;color:var(--apply-muted);font-size:12px;line-height:1.7}.hero-side strong{display:block;color:#dce3eb;font-size:13px;margin-bottom:4px}
.workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.rail,.main-card{background:rgba(17,24,33,.92);border:1px solid var(--apply-line);border-radius:13px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.rail{padding:18px;position:sticky;top:18px}.rail-label{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:#748193;font-weight:700;margin:0 0 14px}
.rail-step{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:8px;color:#7f8b9a;font-size:12px;margin:3px 0}
.rail-step .num{width:23px;height:23px;border:1px solid #354252;border-radius:7px;display:grid;place-items:center;font-size:10px}
.rail-step.active{background:#1a2633;color:#e5ebf2}.rail-step.active .num{background:#dce5ef;color:#17212c;border-color:#dce5ef}
.rail-step.done{color:#c4d0dc}.rail-step.done .num{border-color:#8396aa;color:#d9e2eb}
.rail-note{border-top:1px solid var(--apply-line);padding-top:14px;margin-top:18px;color:#788596;font-size:11px;line-height:1.65}
.main-card{padding:clamp(20px,3vw,34px);min-height:390px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#8797a9;font-weight:700}
h2{font-size:22px;letter-spacing:-.025em;margin:9px 0 9px;color:#f0f3f7}
.introline,.help{font-size:13px;color:#9aa6b4;line-height:1.7;margin:0 0 22px}
.question{font-size:18px;font-weight:650;line-height:1.45;margin:10px 0 13px;color:#f0f3f7}
.step-label{display:flex;justify-content:space-between;color:#8996a5;font-size:11px}
.progress{height:3px;background:#27313d;border-radius:8px;overflow:hidden;margin:12px 0 28px}.progress>span{display:block;height:100%;background:#aab9c9;transition:width .28s ease}
.notice{border:1px solid var(--apply-line);background:#141e29;border-radius:9px;padding:14px 16px;color:#b1bdca;font-size:12px;line-height:1.7;margin:15px 0}
.notice strong{color:#edf1f5}.notice.warning{border-color:rgba(188,157,103,.35);background:rgba(107,82,39,.13)}.notice.error{border-color:rgba(194,117,117,.4);background:rgba(110,46,46,.13)}.notice.success{border-color:rgba(125,166,143,.32);background:rgba(47,91,64,.13)}
.apply-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:24px}
.btn{border:1px solid #3a4858;background:#182330;color:#e7edf4;padding:11px 16px;border-radius:7px;font:600 12px system-ui,sans-serif;cursor:pointer;transition:background .18s,border-color .18s,transform .18s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:40px}
.btn:hover{background:#223142;border-color:#61758b}.btn.primary{background:#dce5ee;color:#17212c;border-color:#dce5ee}.btn.primary:hover{background:#fff}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
textarea,select{width:100%;border:1px solid #354353;background:#0d151e;color:#e8edf4;border-radius:8px;padding:14px;font:13px/1.7 system-ui,sans-serif;resize:vertical;transition:border-color .18s,box-shadow .18s}
textarea{min-height:165px}textarea:focus,select:focus{outline:0;border-color:#8397ad;box-shadow:0 0 0 3px rgba(131,151,173,.12)}
.checkline{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid #354353;border-radius:9px;background:#111b26;font-size:12px;line-height:1.7;color:#c4ced9}.checkline input{margin-top:3px;flex-shrink:0;width:16px;height:16px;accent-color:#c8d4e0}
.status{font-size:12px;color:#9ba8b7;min-height:20px;margin-top:13px}.small-link{color:#e3eaf2;text-decoration:underline;text-underline-offset:3px}
.loading-state{min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--ink-muted);font-size:12px}
.loading-state strong{font-size:13px;font-weight:600;color:var(--ink)}
.loading-spinner{width:30px;height:30px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:apply-spin .8s linear infinite}
@keyframes apply-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.loading-spinner{animation:none;border-top-color:var(--line-strong)}}

.ambient-icon{width:36px;height:36px;border:1px solid var(--apply-line);border-radius:8px;background:#111a24;color:#cbd5df;display:grid;place-items:center;font-size:17px;cursor:pointer}
.ambient-icon:hover,.ambient-icon[aria-pressed="true"]{background:#202d3b;border-color:#61758b;color:#fff}
.review-answer{border:1px solid var(--apply-line);border-radius:8px;padding:12px 14px;margin:10px 0;color:#c1ccd8;font-size:12px;line-height:1.7;white-space:pre-wrap}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:15px}.hero-side{border-left:0;border-top:1px solid var(--apply-line);padding:12px 0 0}.workspace{grid-template-columns:1fr}.rail{position:static;display:flex;align-items:center;gap:4px;overflow:auto;padding:10px}.rail-label,.rail-note{display:none}.rail-step{white-space:nowrap;padding:7px}.rail-step .num{width:21px;height:21px}.apply-wrap{padding:20px 14px 48px}.topmeta{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Match the main MET site theme and keep recruitment copy compact. */
body{background:var(--bg)!important;color:var(--ink)!important}
body:before{display:none}
.apply-wrap{color:var(--ink)}
.topline{border-color:var(--line)}
.brand b{color:var(--ink);letter-spacing:0;font-weight:650}
.brand small,.topmeta,.hero-side,.intro,.eyebrow,.introline,.help,.rail-label,.rail-note,.rail-step,.step-label,.status{color:var(--ink-muted)!important}
.kicker{color:var(--ink-muted);letter-spacing:.12em}
h1,h2,.question{color:var(--ink)!important}
.hero-side strong{color:var(--ink)!important}
.rail-step{color:var(--ink-muted)!important}
.rail-step.active{background:var(--surface-alt)!important;color:var(--ink)!important}
.rail-step .num{border-color:var(--line-strong);color:var(--ink-muted)}
.rail-step.active .num{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.rail-step.done .num{border-color:var(--line-strong);color:var(--ink)}
.progress{background:var(--line)}
.progress>span{background:var(--accent)}
.notice,.checkline,.ambient-icon{background:var(--surface-alt)!important;color:var(--ink-soft)!important;border-color:var(--line)!important}
.notice strong{color:var(--ink)!important}
.notice.warning{background:var(--warning-wash)!important;border-color:var(--line-strong)!important}
.notice.error{background:var(--danger-wash)!important;border-color:var(--line-strong)!important}
.notice.success{background:var(--success-wash)!important;border-color:var(--line-strong)!important}
.btn{background:var(--surface-alt);color:var(--ink);border-color:var(--line-strong)}
.btn:hover{background:var(--surface-hover);border-color:var(--line-strong)}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.primary:hover{opacity:.9;background:var(--accent)}
textarea,select{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.checkline{color:var(--ink-soft)!important}
.checkline input{accent-color:var(--accent)}
.small-link{color:var(--ink)}
.review-answer{border-color:var(--line);color:var(--ink-soft)}
@media(prefers-reduced-motion:reduce){.progress>span{transition:none}}
</style>
</head>
<body>
<main class="apply-wrap">
  <div class="workspace">
    <aside class="rail"><div class="rail-label">Progress</div><div id="apply-steps"><div class="rail-step active"><span class="num">01</span>Eligibility</div><div class="rail-step"><span class="num">02</span>Application</div><div class="rail-step"><span class="num">03</span>Review</div></div><div class="rail-note">Progress is kept in this tab. Avoid refreshing before you submit.</div></aside>
    <section class="main-card"><div id="apply-content"><div class="loading-state" role="status" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><strong>Checking account eligibility…</strong><span>This usually takes a few seconds.</span></div></div></section>
  </div>
</main>
<div id="toast-container"></div>
<script src="/js/met-application.js?v=4"></script>
</body></html>
